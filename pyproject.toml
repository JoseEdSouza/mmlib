[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mmlib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gpx>=0.2.1",
    "networkx>=3.6",
    "osmnx>=2.0.7",
    "pandas>=2.3.3",
